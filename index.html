<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViVi不動産 買取再販ボード</title>
<style>
  :root{
    --bg:#f5f4ef; --card:#ffffff; --line:#e3e1d8; --line2:#cfcdc2;
    --text:#2c2c2a; --muted:#6f6e68; --hint:#9a988e;
    --blue:#185fa5; --blue-bg:#e6f1fb;
    --amber:#854f0b; --amber-bg:#faeeda;
    --teal:#0f6e56; --teal-bg:#e1f5ee;
    --purple:#534ab7; --purple-bg:#eeedfe;
    --green:#3b6d11; --green-bg:#eaf3de;
    --gray:#5f5e5a; --gray-bg:#f1efe8;
    --red:#a32d2d; --red-bg:#fcebeb;
    --warn:#854f0b; --warn-bg:#faeeda;
    --ok:#3b6d11; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo",sans-serif;background:var(--bg);color:var(--text);padding:20px;line-height:1.6}
  .wrap{max-width:1400px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  h1{font-size:22px;font-weight:600}
  .sub{font-size:13px;color:var(--muted)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button,select,input{font-family:inherit;font-size:14px}
  .btn{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--text)}
  .btn:hover{background:var(--gray-bg)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{opacity:.9}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .label{font-size:13px;color:var(--muted)}
  .stat .value{font-size:26px;font-weight:600;margin-top:2px}
  .stat .value.ok{color:var(--green)}
  .stat .value.alert{color:var(--red)}
  .board{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
  .col{background:rgba(0,0,0,0.015);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:120px}
  .col-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:10px;padding:0 2px}
  .col-head .cnt{color:var(--hint);font-weight:400}
  .pcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px 11px 18px;margin-bottom:9px;cursor:pointer;transition:border-color .15s;overflow:hidden}
  .pcard:hover{border-color:var(--blue)}
  .pcard .name{font-size:13.5px;font-weight:600;margin-bottom:3px}
  .pcard .person{font-size:12px;color:var(--muted);margin-bottom:7px}
  .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px}
  .row .k{color:var(--muted)}
  .row .v{font-weight:500}
  .v.profit{color:var(--green)}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:7px;margin-top:7px}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.alert{background:var(--red-bg);color:var(--red)}
  .badge.ok{background:var(--green-bg);color:var(--green)}
  .col[data-phase] .col-head{border-left:3px solid var(--gray);padding-left:8px}
  .col.p1 .col-head{border-color:var(--gray)} .col.p2 .col-head{border-color:var(--blue)}
  .col.p3 .col-head{border-color:var(--teal)} .col.p4 .col-head{border-color:var(--amber)}
  .col.p5 .col-head{border-color:var(--purple)} .col.p6 .col-head{border-color:var(--red)}
  .col.p7 .col-head{border-color:var(--green)}
  .setup{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px}
  .setup h2{font-size:15px;font-weight:600;margin-bottom:8px}
  .setup p{font-size:13px;color:var(--muted);margin-bottom:12px}
  .setup .field{display:flex;gap:8px;flex-wrap:wrap}
  .setup input{flex:1;min-width:240px;border:1px solid var(--line2);border-radius:8px;padding:9px 12px}
  .empty{text-align:center;color:var(--hint);font-size:13px;padding:30px 0}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:var(--radius);padding:22px 24px;max-width:440px;width:100%}
  .modal h3{font-size:17px;font-weight:600;margin-bottom:4px}
  .modal .msub{font-size:13px;color:var(--muted);margin-bottom:16px}
  .modal table{width:100%;font-size:13px;border-collapse:collapse}
  .modal td{padding:6px 0;border-bottom:1px solid var(--line)}
  .modal td:first-child{color:var(--muted)}
  .modal td:last-child{text-align:right;font-weight:500}
  .modal .close{margin-top:16px;width:100%}
  .err{color:var(--red);font-size:13px;margin-top:8px}
  .updated{font-size:12px;color:var(--hint)}
  .filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{background:#fff;border:1px solid var(--line2);border-radius:9999px;padding:7px 14px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:7px;font-size:13px}
  .chip:hover{background:var(--gray-bg)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip .cc{font-size:11px;opacity:.75}
  .tband{position:absolute;left:0;top:0;bottom:0;width:7px}
  .tlabel{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ViVi不動産 買取再販ボード</h1>
      <div class="sub">物件の進捗・収支を一目で把握</div>
    </div>
    <div class="toolbar">
      <span class="updated" id="updated"></span>
      <a class="btn" href="https://docs.google.com/spreadsheets/d/1vQhsiTwDX3eY2KeBdBI24w2aEKOlsViBlgJ5qtWGy_g/edit" target="_blank" rel="noopener" style="text-decoration:none">スプレッドシート</a>
      <a class="btn" href="https://s-yago.github.io/kaitoridsaihan/import.html" target="_blank" rel="noopener" style="text-decoration:none">PDF取り込み</a>
      <button class="btn" onclick="reload()">再読み込み</button>
      <button class="btn" onclick="toggleSetup()">設定</button>
    </div>
  </header>

  <div class="setup" id="setup">
    <h2>スプレッドシートのリンクを設定</h2>
    <p>スプレッドシートを「ファイル → 共有 → ウェブに公開」でCSV公開し、そのリンクを貼り付けてください。空のままだとサンプルデータで表示します。</p>
    <div class="field">
      <input type="text" id="csvUrl" placeholder="https://docs.google.com/spreadsheets/d/e/..../pub?output=csv">
      <button class="btn primary" onclick="saveUrl()">読み込む</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="filter" id="filter"></div>
  <div class="stats" id="stats"></div>
  <div class="board" id="board"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
const PHASES=["仕入検討","買取契約","移転完了","リノベ中","販売中","契約済","売却完了"];
const PHASE_CLASS={"仕入検討":"p1","買取契約":"p2","移転完了":"p3","リノベ中":"p4","販売中":"p5","契約済":"p6","売却完了":"p7"};
const STALE_DAYS=45;
const TYPES=["土地","戸建て","マンション","その他"];
const TYPE_BG={"土地":"--green-bg","戸建て":"--amber-bg","マンション":"--blue-bg","その他":"--red-bg"};
const TYPE_FG={"土地":"--green","戸建て":"--amber","マンション":"--blue","その他":"--red"};
let FILTER="すべて";

const SAMPLE=[
 {種別:"マンション",マンション名:"桜町マンション",部屋番号:"302",住所:"富山市桜町",担当:"田中",フェーズ:"リノベ中",取得価格:11800000,リノベ予算:3000000,リノベ実績:3450000,諸経費:900000,売出価格:0,成約価格:0,フェーズ更新日:"2026-05-20",買取契約日:"2026-04-15",残金決済日:"2026-05-10"},
 {種別:"戸建て",物件名:"新庄戸建て",住所:"富山市新庄町",担当:"佐藤",フェーズ:"移転完了",取得価格:16500000,リノベ予算:4200000,リノベ実績:4100000,諸経費:1200000,売出価格:0,成約価格:0,フェーズ更新日:"2026-06-01",買取契約日:"2026-05-12",残金決済日:"2026-05-30"},
 {種別:"マンション",マンション名:"五福リバーサイド",部屋番号:"1101",住所:"富山市五福",担当:"田中",フェーズ:"販売中",取得価格:18000000,リノベ予算:3500000,リノベ実績:3500000,諸経費:1100000,売出価格:24800000,成約価格:0,フェーズ更新日:"2026-03-10",買取契約日:"2026-01-20",残金決済日:"2026-02-15"},
 {種別:"マンション",マンション名:"太郎丸ハイツ",部屋番号:"205",住所:"富山市太郎丸",担当:"鈴木",フェーズ:"契約済",取得価格:13000000,リノベ予算:2800000,リノベ実績:2750000,諸経費:950000,売出価格:19800000,成約価格:19800000,フェーズ更新日:"2026-06-08",買取契約日:"2026-04-28",残金決済日:"2026-05-20"},
 {種別:"戸建て",物件名:"堀川小泉戸建て",住所:"富山市堀川小泉町",担当:"佐藤",フェーズ:"売却完了",取得価格:15000000,リノベ予算:3200000,リノベ実績:3300000,諸経費:1250000,売出価格:21800000,成約価格:21500000,フェーズ更新日:"2026-05-15",買取契約日:"2026-03-01",残金決済日:"2026-03-25"},
 {種別:"土地",物件名:"問屋町 売地",住所:"富山市問屋町",担当:"鈴木",フェーズ:"買取契約",取得価格:9800000,リノベ予算:0,リノベ実績:0,諸経費:700000,売出価格:0,成約価格:0,フェーズ更新日:"2026-06-10",買取契約日:"2026-05-25",残金決済日:"2026-06-08"},
 {種別:"その他",物件名:"小杉アパート（1棟）",住所:"射水市小杉",担当:"田中",フェーズ:"仕入検討",取得価格:28000000,リノベ予算:5000000,リノベ実績:0,諸経費:1500000,売出価格:0,成約価格:0,フェーズ更新日:"2026-06-12",買取契約日:"2026-06-05",残金決済日:""},
];

let DATA=[];
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const oku=n=>n>=100000000?"¥"+(n/100000000).toFixed(2)+"億":(n>=10000?"¥"+Math.round(n/10000).toLocaleString()+"万":yen(n));
function dispName(p){
  if(p.種別==="マンション"){
    const nm=(p.マンション名||"").trim();const rm=(p.部屋番号||"").trim();
    if(nm||rm) return (nm+" "+rm).trim();
  }
  return (p.物件名||p.マンション名||"(名称未設定)").trim();
}
function ptype(p){const t=(p.種別||"").trim();return TYPES.includes(t)?t:"その他";}

function num(v){if(v==null)return 0;const s=(""+v).replace(/[^0-9.\-]/g,"");const n=parseFloat(s);return isNaN(n)?0:n}
function daysSince(d){if(!d)return 0;const t=new Date(d);if(isNaN(t))return 0;return Math.floor((Date.now()-t)/86400000)}

function cost(p){return num(p.取得価格)+Math.max(num(p.リノベ実績),num(p.リノベ予算))+num(p.諸経費)}
function salePrice(p){return num(p.成約価格)||num(p.売出価格)}
function profit(p){const s=salePrice(p);return s>0?s-cost(p):0}
function margin(p){const s=salePrice(p);return s>0?profit(p)/s*100:0}

function render(){
  renderFilter();renderStats();renderBoard();
  document.getElementById("updated").textContent="最終更新 "+new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

function renderStats(){
  const view=visible();
  const active=view.filter(p=>p.フェーズ!=="売却完了");
  const done=view.filter(p=>p.フェーズ==="売却完了");
  const stock=active.reduce((s,p)=>s+cost(p),0);
  const doneProfit=done.reduce((s,p)=>s+profit(p),0);
  const margins=done.map(margin).filter(m=>m>0);
  const avgMargin=margins.length?margins.reduce((a,b)=>a+b,0)/margins.length:0;
  const alerts=view.filter(p=>isAlert(p)).length;
  const cards=[
    {label:"進行中物件",value:active.length+"件"},
    {label:"在庫金額",value:oku(stock)},
    {label:"完了 累計利益",value:oku(doneProfit),cls:"ok"},
    {label:"平均利益率",value:avgMargin.toFixed(1)+"%"},
    {label:"要注意",value:alerts+"件",cls:alerts>0?"alert":""},
  ];
  document.getElementById("stats").innerHTML=cards.map(c=>
    `<div class="stat"><div class="label">${c.label}</div><div class="value ${c.cls||""}">${c.value}</div></div>`).join("");
}

function isAlert(p){
  if(p.フェーズ==="売却完了")return false;
  if((p.フェーズ==="販売中"||p.フェーズ==="契約済")&&daysSince(p.フェーズ更新日)>=STALE_DAYS*2)return true;
  if(p.フェーズ==="リノベ中"&&num(p.リノベ実績)>num(p.リノベ予算)&&num(p.リノベ予算)>0)return true;
  return false;
}

function visible(){return FILTER==="すべて"?DATA:DATA.filter(p=>ptype(p)===FILTER);}
function renderFilter(){
  const opts=["すべて",...TYPES];
  const counts={};opts.forEach(o=>counts[o]=o==="すべて"?DATA.length:DATA.filter(p=>ptype(p)===o).length);
  document.getElementById("filter").innerHTML=opts.map(o=>
    `<button class="chip ${FILTER===o?'on':''}" onclick="setFilter('${o}')">${o}<span class="cc">${counts[o]}</span></button>`).join("");
}
function setFilter(f){FILTER=f;render();}
function renderBoard(){
  const board=document.getElementById("board");
  const view=visible();
  board.innerHTML=PHASES.map((ph,i)=>{
    const items=view.filter(p=>p.フェーズ===ph);
    const cards=items.map(p=>cardHtml(p,DATA.indexOf(p))).join("")||`<div class="empty">―</div>`;
    return `<div class="col ${PHASE_CLASS[ph]}" data-phase="${ph}">
      <div class="col-head"><span>${ph}</span><span class="cnt">${items.length}</span></div>${cards}</div>`;
  }).join("");
}

function cardHtml(p,index){
  const done=p.フェーズ==="売却完了";
  const pr=profit(p);
  let priceRow="";
  if(done) priceRow=`<div class="row"><span class="k">成約</span><span class="v">${oku(num(p.成約価格))}</span></div>`;
  else if(num(p.売出価格)>0) priceRow=`<div class="row"><span class="k">売出</span><span class="v">${oku(num(p.売出価格))}</span></div>`;
  else priceRow=`<div class="row"><span class="k">取得</span><span class="v">${oku(num(p.取得価格))}</span></div>`;
  const profitRow=pr>0?`<div class="row"><span class="k">${done?"確定利益":"想定粗利"}</span><span class="v profit">${oku(pr)}</span></div>`:"";
  let badge="";
  if(done) badge=`<span class="badge ok">利益率 ${margin(p).toFixed(1)}%</span>`;
  else if(isAlert(p)){
    if(p.フェーズ==="リノベ中") badge=`<span class="badge warn">予算超過</span>`;
    else badge=`<span class="badge alert">${daysSince(p.フェーズ更新日)}日停滞</span>`;
  }
  const t=ptype(p);
  const band=`<div class="tband" style="background:var(${TYPE_FG[t]})"></div>`;
  const label=`<span class="tlabel" style="color:var(${TYPE_FG[t]})">${t}</span>`;
  return `<div class="pcard" onclick="openModal(${index})">
    ${band}
    ${label}
    <div class="name">${esc(dispName(p))}</div>
    <div class="person">担当 ${esc(p.担当||"")}</div>
    ${priceRow}${profitRow}${badge}</div>`;
}

function openModal(i){
  const p=DATA[i];const pr=profit(p);
  document.getElementById("modal").innerHTML=`
    <h3>${esc(dispName(p))}</h3>
    <div class="msub">${esc(ptype(p))} ／ ${esc(p.住所||"")} ／ 担当 ${esc(p.担当||"")}</div>
    <table>
      <tr><td>種別</td><td>${esc(ptype(p))}</td></tr>
      ${ptype(p)==="マンション"?`<tr><td>マンション名</td><td>${esc(p.マンション名||"-")}</td></tr><tr><td>部屋番号</td><td>${esc(p.部屋番号||"-")}</td></tr>`:""}
      <tr><td>現フェーズ</td><td>${esc(p.フェーズ)}</td></tr>
      <tr><td>フェーズ更新日</td><td>${esc(p.フェーズ更新日||"-")}</td></tr>
      <tr><td>買取契約日</td><td>${esc(p.買取契約日||"-")}</td></tr>
      <tr><td>残金決済日</td><td>${esc(p.残金決済日||"-")}</td></tr>
      <tr><td>取得価格</td><td>${yen(num(p.取得価格))}</td></tr>
      <tr><td>リノベ予算</td><td>${yen(num(p.リノベ予算))}</td></tr>
      <tr><td>リノベ実績</td><td>${yen(num(p.リノベ実績))}</td></tr>
      <tr><td>諸経費</td><td>${yen(num(p.諸経費))}</td></tr>
      <tr><td>総コスト</td><td>${yen(cost(p))}</td></tr>
      <tr><td>売出価格</td><td>${num(p.売出価格)>0?yen(num(p.売出価格)):"-"}</td></tr>
      <tr><td>成約価格</td><td>${num(p.成約価格)>0?yen(num(p.成約価格)):"-"}</td></tr>
      <tr><td>${p.フェーズ==="売却完了"?"確定利益":"想定粗利"}</td><td>${pr>0?yen(pr):"-"}</td></tr>
      <tr><td>利益率</td><td>${margin(p)>0?margin(p).toFixed(1)+"%":"-"}</td></tr>
    </table>
    <button class="btn primary close" onclick="closeModal()">閉じる</button>`;
  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){document.getElementById("modalBg").classList.remove("show")}
function esc(s){return(""+(s==null?"":s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}

function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=""}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=""}
      else if(c==='\r'){}else cell+=c}}
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function rowsToObjects(rows){
  if(rows.length<2)return[];
  const head=rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||"").trim());return o})
    .filter(o=>(o.物件名&&o.物件名.trim())||(o.マンション名&&o.マンション名.trim()));
}

function loadFromUrl(url){
  document.getElementById("err").textContent="読み込み中...";
  fetch(url).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()})
    .then(t=>{const objs=rowsToObjects(parseCSV(t));
      if(!objs.length)throw new Error("データが空、または1行目に「物件名」列が見つかりません");
      DATA=objs;document.getElementById("err").textContent="";render();
      document.getElementById("setup").style.display="none";})
    .catch(e=>{document.getElementById("err").textContent="読み込み失敗: "+e.message+"（公開設定・列名をご確認ください）";});
}

function saveUrl(){const u=document.getElementById("csvUrl").value.trim();
  if(!u){DATA=SAMPLE;render();document.getElementById("setup").style.display="none";return}
  localStorage.setItem("baikai_csv_url",u);loadFromUrl(u);}
function reload(){const u=localStorage.getItem("baikai_csv_url");if(u)loadFromUrl(u);else{DATA=SAMPLE;render()}}
function toggleSetup(){const s=document.getElementById("setup");s.style.display=s.style.display==="none"?"block":"none";
  const u=localStorage.getItem("baikai_csv_url");if(u)document.getElementById("csvUrl").value=u;}

(function init(){
  const u=localStorage.getItem("baikai_csv_url");
  if(u){document.getElementById("csvUrl").value=u;loadFromUrl(u)}
  else{DATA=SAMPLE;render()}
})();
</script>

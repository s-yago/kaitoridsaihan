<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>買取再販ボードは移転しました</title>
<style>
  :root{--bg:#f4f2ee;--card:#ffffff;--text:#1f2a37;--muted:#5b6573;--accent:#1a5fa8;--line:#dcd6cc;}
  @media (prefers-color-scheme: dark){:root{--bg:#1b1d21;--card:#25282e;--text:#eef0f3;--muted:#b3bac4;--accent:#5aa2ec;--line:#3a3f47;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;padding:40px 36px;text-align:center}
  h1{font-size:30px;margin:0 0 20px}
  p{font-size:20px;line-height:1.8;margin:0 0 16px;color:var(--text)}
  .note{font-size:17px;color:var(--muted)}
  a.btn{display:inline-block;margin:16px 0 24px;background:var(--accent);color:#fff;text-decoration:none;font-size:24px;font-weight:bold;
        padding:18px 36px;border-radius:12px}
  a.btn:hover{opacity:.9}
</style>
</head>
<body>
  <div class="card">
    <h1>買取再販ボードは移転しました</h1>
    <p>セキュリティ強化のため、買取再販ボードは<br><b>社内専用の新しい場所</b>に移りました。</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbxFu5EqMm0MQ6xUTToMF9rVX3-56rYEtrFVmt2Nv7CRaEiOxwZRA4wVbH_zahWAwGSQ4Q/exec">新しいボードを開く</a>
    <p class="note">会社のGoogleアカウント（@vivi-f.jp）で開いてください。<br>
    初回だけ「アクセスの許可」の画面が出ます。「参照」だけの許可なので、そのまま進めてください。<br>
    ブックマークは新しいボードのアドレスに登録し直してください。</p>
  </div>
</body>
</html>
